<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Anjuuu</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        font-family: 'Segoe UI', sans-serif;
    }

    .container {
        text-align: center;
        cursor: pointer;
    }

    .click-text {
        font-size: 28px;
        color: white;
        animation: pulse 1.5s infinite;
    }

    .card {
        display: none;
        background: white;
        padding: 40px 60px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        animation: pop 1s ease forwards;
    }

    h1 {
        color: #ff4b5c;
        font-size: 40px;
        margin-bottom: 10px;
    }

    p {
        font-size: 22px;
        color: #333;
    }

    /* Balloons */
    .balloon {
        position: absolute;
        bottom: -150px;
        width: 60px;
        height: 80px;
        border-radius: 50%;
        animation: float 6s infinite ease-in;
    }

    .balloon::after {
        content: "";
        position: absolute;
        width: 2px;
        height: 40px;
        background: #555;
        left: 50%;
        top: 80px;
    }

    @keyframes float {
        0% { transform: translateY(0); }
        100% { transform: translateY(-120vh); }
    }

    @keyframes pop {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }
</style>
</head>

<body>

<div class="container" onclick="revealSurprise()">
    <div class="click-text">🎁 Click to open your surprise 🎁</div>

    <div class="card" id="card">
        <h1>🎉 Happy Birthday Anjuuu 🎉</h1>
        <p>God bless you 💖</p>
    </div>
</div>

<!-- Music -->
<audio id="music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
    function revealSurprise() {
        document.querySelector('.click-text').style.display = 'none';
        document.getElementById('card').style.display = 'block';

        // Play music
        document.getElementById('music').play();

        // Create balloons
        for (let i = 0; i < 20; i++) {
            let balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.style.left = Math.random() * 100 + 'vw';
            balloon.style.background = `hsl(${Math.random() * 360}, 70%, 60%)`;
            balloon.style.animationDuration = (4 + Math.random() * 4) + 's';
            document.body.appendChild(balloon);
        }
    }
</script>

</body>
</html>
